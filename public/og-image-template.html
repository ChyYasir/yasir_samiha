<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 1200px;
        height: 630px;
        background: linear-gradient(
          135deg,
          #0f3d2c 0%,
          #1a5943 50%,
          #2d7a5f 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Georgia", serif;
      }
      .container {
        text-align: center;
        color: #faf8f3;
        padding: 60px;
      }
      .bismillah {
        font-size: 48px;
        margin-bottom: 40px;
        color: #c9a961;
        text-shadow: 0 0 30px rgba(201, 169, 97, 0.5);
      }
      .line {
        width: 200px;
        height: 2px;
        background: linear-gradient(
          to right,
          transparent,
          #c9a961,
          transparent
        );
        margin: 30px auto;
      }
      .title {
        font-size: 72px;
        font-weight: bold;
        margin: 40px 0;
        color: #faf8f3;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }
      .subtitle {
        font-size: 36px;
        color: #c9a961;
        margin: 20px 0;
      }
      .date {
        font-size: 42px;
        margin: 30px 0;
        color: #faf8f3;
      }
      .venue {
        font-size: 32px;
        color: #e5d4a6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="bismillah">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
      <div class="line"></div>
      <div class="subtitle">You are cordially invited to</div>
      <div class="title">Yasir Rahman<br />&<br />Ishraq Samiha</div>
      <div class="line"></div>
      <div class="date">17 January 2026 • 8:30 PM</div>
      <div class="venue">
        Shoronika Community Center<br />Lovelane, Chattogram
      </div>
    </div>
  </body>
</html>
